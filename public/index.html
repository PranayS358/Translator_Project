<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Channel Translator Inbox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <div class="brand">🌐 Translator Inbox</div>
      <div class="topbar-actions">
        <select id="primary-language" title="Translate incoming messages to">
          <option value="en">English</option>
          <option value="ar">Arabic (العربية)</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="ur">Urdu</option>
          <option value="hi">Hindi</option>
        </select>
        <button id="theme-toggle" class="icon-btn" title="Toggle dark/light theme"></button>
        <button id="calendar-toggle" class="icon-btn" title="Hijri/Gregorian calendar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
      </div>
    </header>

    <div class="body">

      <!-- Conversation list -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Conversations</h2>
          <button id="refresh-conversations" class="icon-btn small" title="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
        <div id="conversation-list" class="conversation-list">
          <p class="empty-hint">No conversations yet.</p>
        </div>

        <details class="simulate-box">
          <summary>Simulate a message (no real account needed)</summary>
          <select id="sim-channel">
            <option value="whatsapp">WhatsApp</option>
            <option value="messenger">Messenger</option>
            <option value="instagram">Instagram</option>
          </select>
          <input id="sim-from" type="text" placeholder="Contact (e.g. +9665xxxxxxx)" />
          <input id="sim-text" type="text" placeholder="Message text..." />
          <button id="sim-send">Send</button>
        </details>
      </aside>

      <!-- Active conversation thread -->
      <main class="thread-panel">
        <div class="thread-header" id="thread-header-bar">
          <span id="thread-header">Select a conversation</span>
          <div class="thread-header-actions">
            <button id="menu-toggle" class="icon-btn small" title="Chat menu" style="display:none">☰</button>
            <div id="menu-dropdown" class="dropdown-menu hidden">
              <button data-action="search">Search</button>
              <button data-action="media">Media, links and docs</button>
              <button data-action="theme">Chat theme</button>
            </div>
          </div>
        </div>

        <div id="search-bar" class="search-bar hidden">
          <input id="search-input" type="text" placeholder="Search in this chat..." />
          <button id="search-close" class="icon-btn small">✕</button>
        </div>

        <div id="media-panel" class="media-panel hidden">
          <div class="media-panel-header">
            <span>Media, links &amp; docs</span>
            <button id="media-panel-close" class="icon-btn small">✕</button>
          </div>
          <div id="media-panel-body"></div>
        </div>

        <div id="thread-messages" class="thread-messages"></div>

        <form id="reply-form" class="reply-form" style="display:none">
          <button type="button" id="attach-toggle" class="icon-btn" title="Attach">📎</button>
          <div id="attach-menu" class="dropdown-menu hidden">
            <button type="button" data-attach="image">🖼️ Image</button>
            <button type="button" data-attach="document">📄 Document</button>
            <button type="button" data-attach="video">🎬 Video</button>
            <button type="button" data-attach="contact">👤 Contact</button>
            <button type="button" data-attach="location">📍 Location</button>
            <button type="button" data-attach="poll">📊 Poll</button>
            <button type="button" data-attach="event">📅 Event</button>
          </div>
          <input id="reply-text" type="text" placeholder="Type a reply — it'll be translated automatically..." />
          <button type="button" id="camera-toggle" class="icon-btn" title="Camera">📷</button>
          <button type="button" id="mic-toggle" class="icon-btn" title="Record voice">🎙️</button>
          <button type="submit">Send</button>
        </form>

        <input type="file" id="file-image" accept="image/*" style="display:none" />
        <input type="file" id="file-document" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip" style="display:none" />
        <input type="file" id="file-video" accept="video/*" style="display:none" />
      </main>

      <!-- Calendar side panel -->
      <aside id="calendar-panel" class="calendar-panel hidden">
        <h2>Hijri / Gregorian Calendar</h2>
        <div id="today-box"><p class="empty-hint">Loading…</p></div>

        <h3>Gregorian → Hijri</h3>
        <input id="greg-input" type="date" />
        <button id="greg-to-hijri-btn">Convert</button>
        <p id="greg-result"></p>

        <h3>Hijri → Gregorian</h3>
        <input id="hijri-input" type="text" placeholder="e.g. 1447-01-15" />
        <button id="hijri-to-greg-btn">Convert</button>
        <p id="hijri-result"></p>
      </aside>

    </div>
  </div>

  <!-- Chat theme picker modal -->
  <div id="theme-modal" class="modal hidden">
    <div class="modal-box theme-modal-box">
      <h3>Chat theme</h3>
      <div id="theme-options" class="theme-options-grid"></div>
      <div class="modal-actions">
        <button id="theme-save">Save</button>
        <button id="theme-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Camera capture modal -->
  <div id="camera-modal" class="modal hidden">
    <div class="modal-box">
      <video id="camera-video" autoplay playsinline></video>
      <canvas id="camera-canvas" style="display:none"></canvas>
      <div class="modal-actions">
        <button id="camera-capture">📸 Capture &amp; send</button>
        <button id="camera-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
